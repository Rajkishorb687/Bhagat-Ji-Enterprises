<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>Bhagat Ji Grocery | Store Manager</title>
<style>
:root{--green:#14532d;--green2:#166534;--bg:#f3f6f4;--card:#fff;--text:#17231b;--muted:#647067;--line:#dce5de;--red:#b91c1c;--gold:#a16207}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(120deg,#14532d,#15803d);color:#fff;padding:17px 16px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #0002}header h1{font-size:21px;margin:0}header p{margin:4px 0 0;font-size:12px;opacity:.9}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}nav{background:#fff;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:5px}nav button{background:transparent;color:#26352b;text-align:left;border:0;padding:11px;border-radius:9px;font-weight:650}nav button.active,nav button:hover{background:#dcfce7;color:#14532d}main{padding:18px;max-width:1200px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:0 2px 6px #00000005;margin-bottom:13px}.stat{font-size:24px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:145px}label{font-size:12px;font-weight:700;color:#4b5b50}input,select,textarea{font:inherit;padding:10px;border:1px solid #cbd5ce;border-radius:8px;background:#fff;width:100%;min-width:0}button{font:inherit;cursor:pointer;border-radius:8px;border:0;padding:10px 13px;background:var(--green2);color:white;font-weight:700}button.secondary{background:#e5eee7;color:#20432c}button.danger{background:#fee2e2;color:#991b1b}button.gold{background:#fef3c7;color:#854d0e}button.small{padding:6px 9px;font-size:12px}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:#506056;background:#f7faf7;font-size:12px}td button{margin:2px}.tablewrap{overflow:auto}.pill{display:inline-block;border-radius:99px;padding:3px 8px;background:#dcfce7;color:#166534;font-size:11px}.pill.red{background:#fee2e2;color:#991b1b}.hidden{display:none!important}.notice{background:#fffbeb;border:1px solid #fde68a;color:#854d0e;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}.success{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.total{font-size:22px;font-weight:850;color:#14532d}.results{max-height:220px;overflow:auto}.result{display:flex;justify-content:space-between;gap:10px;padding:9px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#f0fdf4}.camera{width:100%;max-height:300px;background:#111;border-radius:10px;object-fit:cover}.footer{font-size:11px;color:var(--muted);text-align:center;padding:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.toolbar input{max-width:320px}.empty{text-align:center;padding:24px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{position:sticky;top:67px;z-index:4;flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px}nav button{white-space:nowrap;padding:9px;font-size:12px}main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.field{min-width:125px}header h1{font-size:19px}}@media print{header,nav,.no-print,.footer{display:none!important}.layout{display:block}main{padding:0}.card{box-shadow:none;border:0}.print-only{display:block!important}}
</style></head><body>
<header><h1>🛒 Bhagat Ji Grocery</h1><p>Billing • Stock • उधारी • ब्याज • हिसाब-किताब</p></header>
<div class="layout"><nav id="nav"></nav><main id="app"></main></div><div class="footer">डेटा इसी ब्राउज़र/डिवाइस में सेव होता है • नियमित Backup लें • अभी Cloud Sync चालू नहीं है</div>
<script>
const KEY='bjg_manager_v2'; let db=load(), page='dashboard', cart=[], scanStream=null, scanTarget='';
function blank(){return {products:[],customers:[],sales:[],payments:[],expenses:[],purchases:[],settings:{shop:'Bhagat Ji Grocery',currency:'₹'}}}function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(db));}
const pages=[['dashboard','🏠 डैशबोर्ड'],['billing','🧾 बिलिंग'],['products','📦 सामान / स्टॉक'],['customers','👥 ग्राहक खाते'],['udhari','📒 उधारी व ब्याज'],['purchases','🚚 खरीदारी'],['cashbook','💵 कैशबुक / खर्च'],['reports','📊 रिपोर्ट'],['backup','⚙️ सेटिंग / बैकअप']];
function money(n){return '₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function num(v){return Number(v)||0}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function interest(c,asOf=today()){let principal=num(c.balance), rate=num(c.rate), start=c.interestStart||c.created||today();let days=Math.max(0,Math.floor((new Date(asOf+'T12:00:00')-new Date(start+'T12:00:00'))/86400000));let val= c.period==='monthly'?principal*rate/100*(days/30):principal*rate/100*days/365;return {days,amount:Math.round(val*100)/100,principal,total:principal+val}}
function nav(){document.getElementById('nav').innerHTML=pages.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('')}
function go(p){page=p;nav();render()}function render(){nav();const a=document.getElementById('app');({dashboard:dashboard,billing:billing,products:products,customers:customers,udhari:udhari,purchases:purchases,cashbook:cashbook,reports:reports,backup:backup}[page]||dashboard)(a)}
function dashboard(a){let sales=db.sales.filter(x=>x.date===today()).reduce((s,x)=>s+x.total,0),due=db.customers.reduce((s,c)=>s+num(c.balance),0),stock=db.products.reduce((s,p)=>s+num(p.stock),0),profit=db.sales.filter(x=>x.date===today()).reduce((s,x)=>s+x.items.reduce((z,i)=>z+(i.price-num(i.cost))*i.qty,0),0);a.innerHTML=`<h2>डैशबोर्ड</h2><div class="grid"><div class="card"><div class="muted">आज की बिक्री</div><div class="stat">${money(sales)}</div></div><div class="card"><div class="muted">ग्राहकों की उधारी (मूलधन)</div><div class="stat">${money(due)}</div></div><div class="card"><div class="muted">कुल सामान</div><div class="stat">${db.products.length}</div></div><div class="card"><div class="muted">आज का अनुमानित मार्जिन</div><div class="stat">${money(profit)}</div></div></div><div class="notice">⚠️ ब्याज रिपोर्ट अनुमानित है और मूलधन पर साधारण ब्याज गिनती है। भुगतान/बकाया वास्तविक खाते से मिलाकर रखें। डेटा अभी इसी डिवाइस में है; अलग डिवाइस पर अपने-आप sync नहीं होगा।</div><div class="two"><div class="card"><h3>कम स्टॉक</h3>${db.products.filter(p=>num(p.stock)<=num(p.minStock||5)).slice(0,8).map(p=>`<p>${esc(p.name)} — <b>${num(p.stock)}</b> ${esc(p.unit||'pcs')}</p>`).join('')||'<div class="muted">अभी कम स्टॉक वाला सामान नहीं है।</div>'}</div><div class="card"><h3>हाल के बिल</h3><div class="tablewrap"><table><tr><th>बिल</th><th>ग्राहक</th><th>राशि</th></tr>${db.sales.slice(-6).reverse().map(s=>`<tr><td>${esc(s.bill)}</td><td>${esc(s.customerName||'Cash')}</td><td>${money(s.total)}</td></tr>`).join('')||'<tr><td colspan="3">अभी कोई बिल नहीं</td></tr>'}</table></div></div></div>`}
function billing(a){a.innerHTML=`<h2>बिलिंग</h2><div class="card"><div class="row"><div class="field"><label>ग्राहक</label><select id="billCustomer"><option value="">Cash Customer</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.phone||'')}</option>`).join('')}</select></div><div class="field"><label>सामान खोजें / बारकोड लिखें</label><input id="billSearch" placeholder="नाम, ब्रांड या बारकोड" oninput="searchBill()"></div><button onclick="openScanner('billSearch')">📷 स्कैन</button></div><div id="billResults" class="results"></div></div><div class="card"><h3>बिल के सामान</h3><div class="tablewrap"><table><thead><tr><th>सामान</th><th>रेट</th><th>मात्रा</th><th>कुल</th><th></th></tr></thead><tbody id="cartRows"></tbody></table></div><div class="row" style="justify-content:space-between;margin-top:15px"><div><label>भुगतान</label><select id="billMode"><option value="cash">पूरा भुगतान</option><option value="udhar">उधार में जोड़ें</option></select></div><div class="total" id="cartTotal">₹0</div><button onclick="finishBill()">बिल सेव करें</button></div></div><div id="billReceipt"></div>`;drawCart()}
function searchBill(){let q=document.getElementById('billSearch').value.toLowerCase();let hits=db.products.filter(p=>[p.name,p.brand,p.pack,p.barcode].some(v=>String(v||'').toLowerCase().includes(q))&&(q||false)).slice(0,20);document.getElementById('billResults').innerHTML=hits.map(p=>`<div class="result" onclick="addCart('${p.id}')"><span><b>${esc(p.name)}</b><br><small>${esc(p.brand||'')} ${esc(p.pack||'')} • कोड ${esc(p.barcode||'—')} • स्टॉक ${p.stock}</small></span><b>${money(p.price)}</b></div>`).join('')||(q?'<div class="muted">सामान नहीं मिला</div>':'');let exact=db.products.find(p=>p.barcode&&p.barcode.toLowerCase()===q);if(exact&&q.length>3)addCart(exact.id)}
function addCart(pid){let p=db.products.find(x=>x.id===pid);if(!p)return;let i=cart.find(x=>x.pid===pid);if(i)i.qty++;else cart.push({pid,name:p.name,price:num(p.price),cost:num(p.cost),qty:1});document.getElementById('billSearch').value='';document.getElementById('billResults').innerHTML='';drawCart()}
function drawCart(){let rows=document.getElementById('cartRows');if(!rows)return;rows.innerHTML=cart.map((i,n)=>`<tr><td>${esc(i.name)}</td><td>${money(i.price)}</td><td><input style="width:72px" type="number" min="1" value="${i.qty}" onchange="cart[${n}].qty=Math.max(1,num(this.value));drawCart()"></td><td>${money(i.price*i.qty)}</td><td><button class="danger small" onclick="cart.splice(${n},1);drawCart()">हटाएँ</button></td></tr>`).join('')||'<tr><td colspan="5">सामान खोजकर बिल में जोड़ें</td></tr>';document.getElementById('cartTotal').textContent=money(cart.reduce((s,i)=>s+i.price*i.qty,0))}
function finishBill(){if(!cart.length)return alert('पहले सामान जोड़ें');let cid=document.getElementById('billCustomer').value, c=db.customers.find(x=>x.id===cid), total=cart.reduce((s,i)=>s+i.price*i.qty,0), mode=document.getElementById('billMode').value;if(mode==='udhar'&&!c)return alert('उधार के बिल के लिए पहले ग्राहक चुनें');for(let i of cart){let p=db.products.find(x=>x.id===i.pid);if(p&&num(p.stock)<i.qty&&!confirm(`${p.name} का स्टॉक कम है (${p.stock})। फिर भी बिल बनाएं?`))return}let sale={id:id(),bill:'BJG-'+Date.now().toString().slice(-6),date:today(),customerId:cid,customerName:c?.name||'Cash',phone:c?.phone||'',items:cart.map(x=>({...x})),total,mode};db.sales.push(sale);cart.forEach(i=>{let p=db.products.find(x=>x.id===i.pid);if(p)p.stock=num(p.stock)-i.qty});if(mode==='udhar'){c.balance=num(c.balance)+total;c.updated=today()}save();document.getElementById('billReceipt').innerHTML=`<div class="card"><h3>बिल सेव हो गया: ${sale.bill}</h3><p>ग्राहक: ${esc(sale.customerName)} • कुल: <b>${money(total)}</b></p><button onclick="printSale('${sale.id}')">🖨️ प्रिंट</button> <button class="secondary" onclick="shareSale('${sale.id}')">WhatsApp पर भेजें</button></div>`;cart=[];drawCart();alert('बिल सेव हो गया');}
function products(a){a.innerHTML=`<h2>सामान और स्टॉक</h2><div class="card"><h3>नया सामान / बदलाव</h3><input id="prodId" type="hidden"><div class="row"><div class="field"><label>सामान का नाम *</label><input id="pName" placeholder="जैसे Parle-G"></div><div class="field"><label>ब्रांड</label><input id="pBrand"></div><div class="field"><label>पैक / साइज</label><input id="pPack" placeholder="₹5 / 50g"></div></div><div class="row" style="margin-top:10px"><div class="field"><label>बारकोड / SKU</label><input id="pBarcode"><button class="secondary" onclick="openScanner('pBarcode')">📷 कैमरा स्कैन</button></div><div class="field"><label>खरीद मूल्य</label><input id="pCost" type="number" min="0"></div><div class="field"><label>बिक्री मूल्य</label><input id="pPrice" type="number" min="0"></div><div class="field"><label>स्टॉक</label><input id="pStock" type="number" min="0" value="0"></div><div class="field"><label>कम स्टॉक सीमा</label><input id="pMin" type="number" value="5"></div></div><div class="row" style="margin-top:12px"><button onclick="saveProduct()">सामान सेव करें</button><button class="secondary" onclick="clearProduct()">नया फॉर्म</button></div></div><div class="card"><div class="toolbar"><h3>सामान की सूची (${db.products.length})</h3><input placeholder="सामान खोजें" oninput="filterTable('productTable',this.value)"></div><div class="tablewrap"><table id="productTable"><thead><tr><th>नाम / पैक</th><th>बारकोड</th><th>खरीद</th><th>बिक्री</th><th>स्टॉक</th><th>काम</th></tr></thead><tbody>${db.products.map(p=>`<tr data-search="${esc((p.name+' '+p.brand+' '+p.pack+' '+p.barcode).toLowerCase())}"><td><b>${esc(p.name)}</b><br>${esc(p.brand||'')} ${esc(p.pack||'')}</td><td>${esc(p.barcode||'—')}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${p.stock} ${num(p.stock)<=num(p.minStock||5)?'<span class="pill red">कम</span>':''}</td><td><button class="secondary small" onclick="editProduct('${p.id}')">बदलें</button><button class="danger small" onclick="deleteProduct('${p.id}')">हटाएँ</button></td></tr>`).join('')||'<tr><td colspan="6">अभी सामान नहीं जोड़ा गया</td></tr>'}</tbody></table></div></div>`}
function saveProduct(){let name=document.getElementById('pName').value.trim();if(!name)return alert('सामान का नाम भरें');let pid=document.getElementById('prodId').value, obj={id:pid||id(),name,brand:document.getElementById('pBrand').value.trim(),pack:document.getElementById('pPack').value.trim(),barcode:document.getElementById('pBarcode').value.trim(),cost:num(document.getElementById('pCost').value),price:num(document.getElementById('pPrice').value),stock:num(document.getElementById('pStock').value),minStock:num(document.getElementById('pMin').value)};let ix=db.products.findIndex(p=>p.id===obj.id);if(ix>=0)db.products[ix]=obj;else db.products.push(obj);save();render()}
function clearProduct(){render()}function editProduct(pid){let p=db.products.find(x=>x.id===pid);if(!p)return;render();['prodId','pName','pBrand','pPack','pBarcode','pCost','pPrice','pStock','pMin'].forEach((k,i)=>document.getElementById(k).value=[p.id,p.name,p.brand,p.pack,p.barcode,p.cost,p.price,p.stock,p.minStock][i])}function deleteProduct(pid){if(confirm('यह सामान हटाएँ?')){db.products=db.products.filter(x=>x.id!==pid);save();render()}}
function customers(a){a.innerHTML=`<h2>ग्राहक खाते</h2><div class="card"><h3>नया ग्राहक</h3><input id="custId" type="hidden"><div class="row"><div class="field"><label>नाम *</label><input id="cName"></div><div class="field"><label>मोबाइल</label><input id="cPhone" inputmode="numeric"></div><div class="field"><label>शुरुआती उधारी (मूलधन)</label><input id="cBalance" type="number" min="0" value="0"></div><div class="field"><label>ब्याज दर (%)</label><input id="cRate" type="number" min="0" step="0.1" value="0"></div><div class="field"><label>ब्याज अवधि</label><select id="cPeriod"><option value="monthly">मासिक</option><option value="daily">दैनिक (वार्षिक दर को दैनिक गिनती)</option></select></div><div class="field"><label>ब्याज शुरू तारीख</label><input id="cStart" type="date" value="${today()}"></div></div><div class="row" style="margin-top:12px"><button onclick="saveCustomer()">ग्राहक सेव करें</button><button class="secondary" onclick="render()">फॉर्म साफ करें</button></div></div><div class="card"><div class="toolbar"><h3>ग्राहक सूची (${db.customers.length})</h3><input placeholder="नाम या मोबाइल खोजें" oninput="filterTable('customerTable',this.value)"></div><div class="tablewrap"><table id="customerTable"><thead><tr><th>ग्राहक</th><th>मूलधन बाकी</th><th>ब्याज अनुमान</th><th>कुल अनुमान</th><th>काम</th></tr></thead><tbody>${db.customers.map(c=>{let it=interest(c);return `<tr data-search="${esc((c.name+' '+c.phone).toLowerCase())}"><td><b>${esc(c.name)}</b><br>${esc(c.phone||'—')}</td><td>${money(c.balance)}</td><td>${money(it.amount)}<br><small>${it.days} दिन</small></td><td><b>${money(it.total)}</b></td><td><button class="small" onclick="go('udhari');setTimeout(()=>document.getElementById('ledgerCustomer').value='${c.id}',20)">खाता</button><button class="secondary small" onclick="editCustomer('${c.id}')">बदलें</button></td></tr>`}).join('')||'<tr><td colspan="5">अभी ग्राहक नहीं हैं</td></tr>'}</tbody></table></div></div>`}
function saveCustomer(){let name=document.getElementById('cName').value.trim();if(!name)return alert('ग्राहक का नाम भरें');let cid=document.getElementById('custId').value, old=db.customers.find(c=>c.id===cid),c={id:cid||id(),name,phone:document.getElementById('cPhone').value.trim(),balance:num(document.getElementById('cBalance').value),rate:num(document.getElementById('cRate').value),period:document.getElementById('cPeriod').value,interestStart:document.getElementById('cStart').value||today(),created:old?.created||today()};let ix=db.customers.findIndex(x=>x.id===c.id);if(ix>=0)db.customers[ix]=c;else db.customers.push(c);save();render()}
function editCustomer(cid){let c=db.customers.find(x=>x.id===cid);if(!c)return;render();['custId','cName','cPhone','cBalance','cRate','cPeriod','cStart'].forEach((k,i)=>document.getElementById(k).value=[c.id,c.name,c.phone,c.balance,c.rate,c.period,c.interestStart||today()][i])}
function udhari(a){a.innerHTML=`<h2>उधारी और ब्याज</h2><div class="notice">ब्याज अनुमानित साधारण ब्याज है: मासिक दर पर दिन/30 के हिसाब से; दैनिक विकल्प में दर्ज दर को वार्षिक दर मानकर दिन/365 से गिना जाता है। कानूनी/आपसी शर्तें तय करके ही इस्तेमाल करें।</div><div class="card"><div class="row"><div class="field"><label>ग्राहक चुनें</label><select id="ledgerCustomer" onchange="showLedger()"><option value="">ग्राहक चुनें</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.phone||'')}</option>`).join('')}</select></div><div class="field"><label>जमा राशि</label><input id="payAmount" type="number" min="1"></div><div class="field"><label>जमा तारीख</label><input id="payDate" type="date" value="${today()}"></div><div class="field"><label>नोट</label><input id="payNote" placeholder="नकद / UPI"></div><button onclick="recordPayment()">जमा दर्ज करें</button></div></div><div id="ledgerInfo"></div><div class="card"><h3>भुगतान हिस्ट्री</h3><div class="tablewrap"><table><tr><th>तारीख</th><th>ग्राहक</th><th>राशि</th><th>नोट</th></tr>${db.payments.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(db.customers.find(c=>c.id===p.customerId)?.name||'हटाया ग्राहक')}</td><td>${money(p.amount)}</td><td>${esc(p.note||'')}</td></tr>`).join('')||'<tr><td colspan="4">अभी कोई भुगतान नहीं</td></tr>'}</table></div></div>`}
function showLedger(){let cid=document.getElementById('ledgerCustomer').value,c=db.customers.find(x=>x.id===cid),box=document.getElementById('ledgerInfo');if(!c){box.innerHTML='';return}let it=interest(c);box.innerHTML=`<div class="card"><h3>${esc(c.name)} का खाता</h3><div class="grid"><div><div class="muted">मूलधन बाकी</div><div class="stat">${money(c.balance)}</div></div><div><div class="muted">ब्याज दर</div><div class="stat">${c.rate}%</div><small>${c.period==='monthly'?'मासिक':'वार्षिक आधार पर दैनिक गणना'}</small></div><div><div class="muted">अनुमानित ब्याज (${it.days} दिन)</div><div class="stat">${money(it.amount)}</div></div><div><div class="muted">कुल अनुमानित देय</div><div class="stat">${money(it.total)}</div></div></div><p class="muted">यह ब्याज आज तक का अनुमान है। भुगतान दर्ज करने पर मूलधन घटेगा और ब्याज शुरू तारीख रीसेट होगी।</p><button class="secondary" onclick="shareLedger('${c.id}')">WhatsApp खाता भेजें</button></div>`}
function recordPayment(){let cid=document.getElementById('ledgerCustomer').value,amount=num(document.getElementById('payAmount').value);let c=db.customers.find(x=>x.id===cid);if(!c)return alert('ग्राहक चुनें');if(amount<=0)return alert('जमा राशि भरें');let date=document.getElementById('payDate').value||today();db.payments.push({id:id(),customerId:cid,amount,date,note:document.getElementById('payNote').value});c.balance=Math.max(0,num(c.balance)-amount);c.interestStart=date;save();render();document.getElementById('ledgerCustomer').value=cid;showLedger();alert('भुगतान दर्ज हुआ। राशि मूलधन से घटाई गई है।')}
function purchases(a){a.innerHTML=`<h2>खरीदारी / स्टॉक बढ़ाएँ</h2><div class="card"><div class="row"><div class="field"><label>सामान</label><select id="buyProduct">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} ${esc(p.pack||'')}</option>`).join('')}</select></div><div class="field"><label>मात्रा</label><input id="buyQty" type="number" min="1" value="1"></div><div class="field"><label>प्रति यूनिट खरीद मूल्य</label><input id="buyCost" type="number" min="0"></div><div class="field"><label>सप्लायर / नोट</label><input id="buySupplier"></div><button onclick="savePurchase()">खरीद सेव करें</button></div></div><div class="card"><h3>खरीदारी हिस्ट्री</h3><div class="tablewrap"><table><tr><th>तारीख</th><th>सामान</th><th>मात्रा</th><th>कुल</th><th>सप्लायर</th></tr>${db.purchases.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.total)}</td><td>${esc(x.supplier||'')}</td></tr>`).join('')||'<tr><td colspan="5">कोई खरीद नहीं</td></tr>'}</table></div></div>`}
function savePurchase(){let p=db.products.find(x=>x.id===document.getElementById('buyProduct').value),qty=num(document.getElementById('buyQty').value),cost=num(document.getElementById('buyCost').value);if(!p||qty<=0)return alert('सामान और मात्रा चुनें');p.stock=num(p.stock)+qty;if(cost>0)p.cost=cost;db.purchases.push({id:id(),date:today(),productId:p.id,name:p.name,qty,cost,total:qty*cost,supplier:document.getElementById('buySupplier').value});save();render()}
function cashbook(a){a.innerHTML=`<h2>कैशबुक और खर्च</h2><div class="card"><div class="row"><div class="field"><label>खर्च का नाम</label><input id="expName" placeholder="बिजली, किराया, भाड़ा"></div><div class="field"><label>राशि</label><input id="expAmount" type="number" min="0"></div><div class="field"><label>तारीख</label><input id="expDate" type="date" value="${today()}"></div><button onclick="addExpense()">खर्च सेव करें</button></div></div><div class="grid"><div class="card"><div class="muted">कुल बिक्री</div><div class="stat">${money(db.sales.reduce((s,x)=>s+x.total,0))}</div></div><div class="card"><div class="muted">कुल खर्च</div><div class="stat">${money(db.expenses.reduce((s,x)=>s+x.amount,0))}</div></div><div class="card"><div class="muted">उधारी में बिक्री</div><div class="stat">${money(db.sales.filter(x=>x.mode==='udhar').reduce((s,x)=>s+x.total,0))}</div></div><div class="card"><div class="muted">भुगतान वसूली</div><div class="stat">${money(db.payments.reduce((s,x)=>s+x.amount,0))}</div></div></div><div class="card"><h3>खर्च की सूची</h3><div class="tablewrap"><table><tr><th>तारीख</th><th>विवरण</th><th>राशि</th><th></th></tr>${db.expenses.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.name)}</td><td>${money(x.amount)}</td><td><button class="danger small" onclick="delExpense('${x.id}')">हटाएँ</button></td></tr>`).join('')||'<tr><td colspan="4">अभी खर्च नहीं</td></tr>'}</table></div></div>`}
function addExpense(){let name=document.getElementById('expName').value.trim(),amount=num(document.getElementById('expAmount').value);if(!name||amount<=0)return alert('खर्च का नाम और राशि भरें');db.expenses.push({id:id(),name,amount,date:document.getElementById('expDate').value||today()});save();render()}function delExpense(i){if(confirm('खर्च हटाएँ?')){db.expenses=db.expenses.filter(x=>x.id!==i);save();render()}}
function reports(a){let total=db.sales.reduce((s,x)=>s+x.total,0),cost=db.sales.reduce((s,x)=>s+x.items.reduce((z,i)=>z+num(i.cost)*i.qty,0),0),due=db.customers.reduce((s,c)=>s+num(c.balance),0);a.innerHTML=`<h2>रिपोर्ट</h2><div class="grid"><div class="card"><div class="muted">कुल बिक्री</div><div class="stat">${money(total)}</div></div><div class="card"><div class="muted">बेचे गए सामान की अनुमानित लागत</div><div class="stat">${money(cost)}</div></div><div class="card"><div class="muted">अनुमानित सकल मार्जिन</div><div class="stat">${money(total-cost)}</div></div><div class="card"><div class="muted">उधारी मूलधन बाकी</div><div class="stat">${money(due)}</div></div></div><div class="card"><h3>बिक्री बिल</h3><div class="tablewrap"><table><tr><th>तारीख</th><th>बिल</th><th>ग्राहक</th><th>भुगतान</th><th>कुल</th><th></th></tr>${db.sales.slice().reverse().map(s=>`<tr><td>${s.date}</td><td>${esc(s.bill)}</td><td>${esc(s.customerName)}</td><td>${s.mode==='udhar'?'उधार':'पूरा'}</td><td>${money(s.total)}</td><td><button class="secondary small" onclick="printSale('${s.id}')">प्रिंट</button></td></tr>`).join('')||'<tr><td colspan="6">अभी बिक्री नहीं</td></tr>'}</table></div></div><button onclick="window.print()">रिपोर्ट प्रिंट करें</button>`}
function backup(a){a.innerHTML=`<h2>सेटिंग और बैकअप</h2><div class="card"><h3>बैकअप</h3><p class="muted">सारा डेटा JSON फाइल में डाउनलोड करें। फोन बदलने या ब्राउज़र डेटा हटने से पहले बैकअप जरूर लें।</p><button onclick="exportData()">⬇️ पूरा बैकअप डाउनलोड करें</button> <label class="secondary" style="display:inline-block;padding:10px;border-radius:8px;cursor:pointer">⬆️ बैकअप वापस डालें<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div><div class="card"><h3>दुकान की जानकारी</h3><div class="field"><label>दुकान का नाम</label><input id="shopName" value="${esc(db.settings.shop)}"></div><button style="margin-top:10px" onclick="db.settings.shop=document.getElementById('shopName').value.trim()||'Bhagat Ji Grocery';save();alert('सेटिंग सेव हुई')">सेव करें</button></div><div class="notice">यह संस्करण localStorage में डेटा सेव करता है। अभी Google/Cloud Sync, कई डिवाइसों में साझा डेटा, आधिकारिक WhatsApp API और Play Store ऐप नहीं जुड़े हैं। कैमरा स्कैन के लिए HTTPS वेबसाइट और ब्राउज़र अनुमति चाहिए; कुछ फोन में BarcodeDetector उपलब्ध न हो तो स्कैन काम नहीं करेगा।</div><div class="card"><h3>खाली डेटा</h3><button class="danger" onclick="if(confirm('सभी डेटा हमेशा के लिए मिटाना है? पहले बैकअप लें।')){db=blank();save();render()}">सारा डेटा मिटाएँ</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='Bhagat-Ji-Grocery-Backup-'+today()+'.json';x.click();URL.revokeObjectURL(u)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.customers)throw Error();if(confirm('मौजूदा डेटा बदलकर बैकअप लोड करें?')){db={...blank(),...x};save();render();alert('बैकअप लोड हो गया')}}catch(err){alert('यह सही बैकअप फाइल नहीं है')}};r.readAsText(f)}
function filterTable(id,q){q=q.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=(r.dataset.search||r.innerText.toLowerCase()).includes(q)?'':'none')}
function shareText(text,phone=''){let url='https://wa.me/'+String(phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent(text);if(!phone)url='https://wa.me/?text='+encodeURIComponent(text);window.open(url,'_blank')}function shareLedger(cid){let c=db.customers.find(x=>x.id===cid),it=interest(c);shareText(`${db.settings.shop}\nग्राहक खाता: ${c.name}\nमूलधन बाकी: ${money(c.balance)}\nब्याज दर: ${c.rate}% (${c.period==='monthly'?'मासिक':'दैनिक गणना'})\nअनुमानित ब्याज: ${money(it.amount)}\nकुल अनुमानित देय: ${money(it.total)}\nतारीख: ${today()}`,c.phone)}function shareSale(sid){let s=db.sales.find(x=>x.id===sid);shareText(`${db.settings.shop}\nबिल: ${s.bill}\nतारीख: ${s.date}\n${s.items.map(i=>i.name+' x '+i.qty+' = '+money(i.price*i.qty)).join('\n')}\nकुल: ${money(s.total)}\nधन्यवाद!`,s.phone)}function printSale(sid){let s=db.sales.find(x=>x.id===sid);let w=window.open('','_blank','width=500,height=700');w.document.write(`<html><head><title>${s.bill}</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}</style></head><body><h2>${esc(db.settings.shop)}</h2><p>बिल: ${esc(s.bill)}<br>तारीख: ${s.date}<br>ग्राहक: ${esc(s.customerName)}</p><table><tr><th>सामान</th><th>मात्रा</th><th>रेट</th><th>कुल</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</table><h3>कुल: ${money(s.total)}</h3><p>धन्यवाद!</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
async function openScanner(target){scanTarget=target;let old=document.getElementById('scannerModal');if(old)old.remove();let m=document.createElement('div');m.id='scannerModal';m.style='position:fixed;inset:0;background:#000b;z-index:99;display:grid;place-items:center;padding:15px';m.innerHTML=`<div class="card" style="max-width:500px;width:100%"><div class="toolbar"><h3>बारकोड कैमरा स्कैन</h3><button class="danger" onclick="closeScanner()">बंद</button></div><video id="scanVideo" class="camera" autoplay muted playsinline></video><p id="scanStatus" class="muted">कैमरा शुरू हो रहा है… बारकोड को फ्रेम में रखें।</p><button class="secondary" onclick="closeScanner()">रद्द करें</button></div>`;document.body.appendChild(m);try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera not supported / HTTPS required');if(!('BarcodeDetector'in window))throw Error('इस ब्राउज़र में built-in barcode detector उपलब्ध नहीं है। Chrome अपडेट करके देखें या बारकोड हाथ से लिखें।');let det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});let v=document.getElementById('scanVideo');v.srcObject=scanStream;await v.play();document.getElementById('scanStatus').textContent='बारकोड को कैमरे के सामने रखें…';let scan=async()=>{if(!document.getElementById('scannerModal'))return;try{let codes=await det.detect(v);if(codes.length){let val=codes[0].rawValue;let inp=document.getElementById(scanTarget);if(inp){inp.value=val;inp.dispatchEvent(new Event('input'));if(scanTarget==='billSearch'){let p=db.products.find(x=>String(x.barcode)===val);if(p)addCart(p.id)}}closeScanner();return}}catch(e){}requestAnimationFrame(scan)};requestAnimationFrame(scan)}catch(e){let st=document.getElementById('scanStatus');if(st)st.textContent=e.message||'कैमरा चालू नहीं हुआ। वेबसाइट HTTPS पर खोलें और camera permission Allow करें।';if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}}
function closeScanner(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}document.getElementById('scannerModal')?.remove()}
render();
</script></body></html>
